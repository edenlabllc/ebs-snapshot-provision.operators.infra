# This rule is not used by the project ebs-snapshot-provision itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ebs.aws.edenlab.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ebs-snapshot-provision
    app.kubernetes.io/managed-by: kustomize
  name: ebssnapshotrotation-viewer-role
rules:
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations/status
  verbs:
  - get
