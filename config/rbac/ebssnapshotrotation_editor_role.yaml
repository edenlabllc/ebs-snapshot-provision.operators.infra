# This rule is not used by the project ebs-snapshot-provision itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ebs.aws.edenlab.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ebs-snapshot-provision
    app.kubernetes.io/managed-by: kustomize
  name: ebssnapshotrotation-editor-role
rules:
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations/status
  verbs:
  - get
