# This rule is not used by the project ebs-snapshot-provision itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ebs.aws.edenlab.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ebs-snapshot-provision
    app.kubernetes.io/managed-by: kustomize
  name: ebssnapshotrotation-admin-role
rules:
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations
  verbs:
  - '*'
- apiGroups:
  - ebs.aws.edenlab.io
  resources:
  - ebssnapshotrotations/status
  verbs:
  - get
